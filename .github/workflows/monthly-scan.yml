
name: Wapiti Security Scan

on:
  # 1. الفحص مع كل رفع أو تحديث جديد للكود (CI/CD)
  push:
    branches: [ main ]

  # 2. الفحص الدوري التلقائي (شهرياً: أول يوم في الشهر الساعة 12 ظهراً)
  schedule:
    - cron: '0 12 1 * *'

  # 3 & 4. التشغيل اليدوي الفوري بضغطة زر (عند تغيير الاستضافة أو ظهور ثغرات Zero-Day)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Wapiti
        run: pip install wapiti3

      - name: Run Wapiti Scan
        run: |
          wapiti -u https://amedeo-ncc.vercel.app/ --flush-session -f html -o ./wapiti_report

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: wapiti-security-report
          path: ./wapiti_report