<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCC Grifone | Contatti</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Tajawal:wght@400;600;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height:100vh;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(212,175,55,0.06), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(212,175,55,0.05), transparent 50%),
      #0a0806;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    font-family:'Tajawal', sans-serif;
  }

  .card {
    width:100%;
    max-width:420px;
    text-align:center;
  }

  .logo-img {
    width:180px;
    height:auto;
    margin:0 auto;
    display:block;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.7));
  }

  .divider {
    width:120px;
    height:1px;
    background:linear-gradient(90deg, transparent, #d4af37, transparent);
    margin:14px auto 10px;
  }

  .subtitle {
    font-size:20px;
    font-weight:700;
    color:#d4af37;
    letter-spacing:1px;
    margin-bottom:6px;
  }

  .phone {
    font-family:'Cinzel', serif;
    font-size:19px;
    color:#e9d9a8;
    letter-spacing:1px;
    margin-bottom:36px;
  }

  .btn {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px;
    margin-bottom:14px;
    border-radius:12px;
    text-decoration:none;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.3px;
    border:1px solid rgba(212,175,55,0.35);
    transition:transform .15s ease;
  }
  .btn:active { transform:scale(0.97); }

  .btn-call {
    background:linear-gradient(180deg, #f5e6a3, #d4af37 60%, #a8791f);
    color:#161006;
  }

  .btn-whatsapp {
    background:#1a1a1a;
    color:#25D366;
    border-color:rgba(37,211,102,0.4);
  }

  .btn-website {
    background:#1a1a1a;
    color:#e9d9a8;
  }

  .footer-note {
    margin-top:28px;
    font-size:12px;
    color:#5a5346;
    letter-spacing:0.5px;
  }
</style>
</head>
